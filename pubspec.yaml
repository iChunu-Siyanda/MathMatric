name: math_matric
description: "Matriculants Mathematics App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  hydrated_bloc: ^11.0.0
  equatable: ^2.0.5
  sliver_tools: ^0.2.12
  dotenv: ^4.2.0
  flutter_dotenv: ^6.0.1
  get_it: ^8.0.3
  go_router: ^17.3.0
  flutter_staggered_grid_view: ^0.7.0
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.6
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  cloud_functions: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.7.1
  fake_cloud_firestore: ^4.2.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/papers/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 
